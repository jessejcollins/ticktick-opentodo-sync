[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ticktick-opentodo-sync"
version = "0.0.1"
description = "Two-way task sync between TickTick (primary) and OpenTodo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "cryptography>=43"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
ticktick-opentodo-sync = "ticktick_opentodo_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ticktick_opentodo_sync = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "RET", "TRY", "PIE"]
ignore = ["TRY003"]

[tool.mypy]
strict = true
mypy_path = "tests"
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ticktick-opentodo-sync"
version = "0.0.5"
description = "Two-way task sync between TickTick (primary) and OpenTodo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ticktick", "opentodo", "sync", "todo", "tasks", "habits"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = ["httpx>=0.27,<1", "cryptography>=43"]

[project.urls]
Homepage = "https://github.com/jessejcollins/ticktick-opentodo-sync"
Issues = "https://github.com/jessejcollins/ticktick-opentodo-sync/issues"

[project.optional-dependencies]
# ruff is pinned: `ruff format --check` in the test stage changes with its releases.
dev = ["pytest>=8", "respx>=0.21", "ruff==0.17.6", "mypy>=1.11"]

[project.scripts]
ticktick-opentodo-sync = "ticktick_opentodo_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ticktick_opentodo_sync = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "RET", "TRY", "PIE"]
ignore = ["TRY003"]

[tool.mypy]
strict = true
mypy_path = "tests"
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
